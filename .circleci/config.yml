version: 2.1

jobs:
  quality:
    docker:
      - image: node:26.8.1-bookworm
      - image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: forms_local
          POSTGRES_DB: forms_processor_test
    environment:
      TEST_DATABASE_URL: postgresql://postgres:forms_local@localhost:5432/forms_processor_test
    steps:
      - checkout
      - run: npm ci
      - run:
          name: Lint, type-check, test routing and retries, and compile
          command: |
            npm run lint
            npm run typecheck
            npm test
            npm run test:integration
            npm run build
  deploy:
    docker:
      - image: cimg/python:3.13.2-browsers
    parameters:
      deploy_env:
        type: enum
        enum: [DEV, PROD]
    environment:
      APPNAME: forms-processor-v6
      DEPLOY_ENV: << parameters.deploy_env >>
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install deployment dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq python3-pip
            sudo pip3 install awscli --upgrade
      - run:
          name: Install the pinned Topcoder deployment suite
          command: |
            git -c advice.detachedHead=false clone --quiet --depth 1 --branch v1.4.20 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript
            test "$(git -C ../buildscript rev-parse HEAD)" = 5f3745c35463ce0e2475c12269aa7a2b446456e5
            cp ../buildscript/master_deploy.sh ../buildscript/buildenv.sh ../buildscript/awsconfiguration.sh ../buildscript/psvar-processor.sh .
      - run:
          name: Build tested runtime image
          command: docker buildx build --load --tag "${APPNAME}:latest" .
      - run:
          name: Deploy with the shared master script
          no_output_timeout: 35m
          command: |
            # Same as the other v6 services: deploy settings come from /config/${APPNAME}/deployvar,
            # and every parameter under /config/${APPNAME}/appvar and /config/common/global-appvar
            # (appvar wins) is bound into the task as an ECS secret, including USE_KEYCLOAK.
            ./awsconfiguration.sh $DEPLOY_ENV
            source awsenvconf
            ./psvar-processor.sh -t appenv -p /config/${APPNAME}/deployvar
            source deployvar_env
            ./master_deploy.sh -d ECS -e $DEPLOY_ENV -t latest -j /config/${APPNAME}/appvar,/config/common/global-appvar -i ${APPNAME} -p FARGATE

workflows:
  build-and-deploy:
    jobs:
      - quality
      - deploy:
          name: deploy-dev
          context: org-global
          requires: [quality]
          deploy_env: DEV
          serial-group: << pipeline.project.slug >>/deploy-dev
          filters:
            branches:
              only: develop
      - deploy:
          name: deploy-production
          context: org-global
          requires: [quality]
          deploy_env: PROD
          serial-group: << pipeline.project.slug >>/deploy-production
          filters:
            branches:
              only: master
