version: 2.1
executors:
  reviewed:
    docker:
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
commands:
  checkout-source:
    steps:
    - run:
        name: Check out the exact public source commit over HTTPS
        command: |
          set -euo pipefail
          [[ "$CIRCLE_SHA1" =~ ^[0-9a-f]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init --quiet .
          git remote add origin https://github.com/topcoder-platform/forms-processor-v6.git
          git -c credential.helper= fetch --quiet --depth 1 origin "$CIRCLE_SHA1"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
  checkout-suite:
    steps:
    - run:
        name: Verify deployment suite v2.0.5
        command: |
          set -euo pipefail
          git init --quiet /tmp/tc-deploy-scripts
          git -C /tmp/tc-deploy-scripts remote add origin https://github.com/topcoder-platform/tc-deploy-scripts.git
          git -C /tmp/tc-deploy-scripts fetch --quiet --depth 1 origin refs/tags/v2.0.5
          git -C /tmp/tc-deploy-scripts checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/tc-deploy-scripts rev-parse HEAD)" = bff574ab5c0b46773e25d2af1eff76675fba2ba5
jobs:
  build:
    executor: reviewed
    steps:
    - checkout-source
    - setup_remote_docker
    - checkout-suite
    - run:
        name: Build committed source without AWS or broker credentials
        command: |
          set -euo pipefail
          python3 -I /tmp/tc-deploy-scripts/build_image.py --dockerfile Dockerfile --image forms-processor-v6:candidate
          mkdir -p /tmp/release
          docker save --output /tmp/release/image.tar forms-processor-v6:candidate
        no_output_timeout: 30m
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - image.tar
  deploy:
    executor: reviewed
    parameters:
      environment:
        type: enum
        enum:
        - dev
        - prod
    environment:
      DEPLOY_ENV: << parameters.environment >>
    steps:
    - checkout-source
    - setup_remote_docker
    - checkout-suite
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Promote a scanned digest with repository-bound OIDC
        command: |
          set +x
          set -euo pipefail
          test -f "deploy/${DEPLOY_ENV}.json"
          docker load --input /tmp/release/image.tar
          python3 -I deploy/release.py "deploy/${DEPLOY_ENV}.json"
        no_output_timeout: 45m
  quality:
    docker:
    - image: node@sha256:9f94d34c787165dca03b74e5bf9c3bf90e8de79b19aa3d87fe1fa1694bf75c89
    - image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
      environment:
        POSTGRES_PASSWORD: forms_local
        POSTGRES_DB: forms_processor_test
    environment:
      TEST_DATABASE_URL: postgresql://postgres:forms_local@localhost:5432/forms_processor_test
    steps:
    - checkout-source
    - run: npm ci --install-links=true
    - run:
        name: Lint, type-check, test routing and retries, and compile
        command: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:integration
          npm run build
  deployment-checks:
    executor: reviewed
    steps:
    - checkout-suite
    - run:
        name: Test the pinned deployment security and rollout checks
        command: python3 -m unittest discover -s /tmp/tc-deploy-scripts/tests -q
workflows:
  release:
    jobs:
    - quality
    - deployment-checks
    - build:
        requires:
        - quality
        - deployment-checks
    - deploy:
        name: deploy-dev
        environment: dev
        requires:
        - build
        context: forms-processor-v6-dev-deploy
        serial-group: << pipeline.project.slug >>/deploy-dev
        filters:
          branches:
            only: develop
          tags:
            ignore: /.*/
    - approve-prod:
        type: approval
        requires:
        - build
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
    - deploy:
        name: deploy-prod
        environment: prod
        requires:
        - approve-prod
        context: forms-processor-v6-prod-deploy
        serial-group: << pipeline.project.slug >>/deploy-prod
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
